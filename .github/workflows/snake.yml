name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Executa automaticamente a cada 12 horas
  workflow_dispatch: # Permite que o possas executar manualmente
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Gera a animação em formato SVG a partir das tuas contribuições
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: xMelw
          outputs: |
            dist/github-readme-snake.svg
            dist/github-readme-snake-dark.svg?palette=github-dark

      # Envia o ficheiro SVG gerado para uma branch isolada chamada 'output'
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
