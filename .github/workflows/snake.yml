name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *" # Executa a cada 12 horas
  workflow_dispatch: # Permite execução manual
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate github-readme-snake.svg
        uses: Platane/svg-snk@v3
        with:
          github_user_name: xMelw
          outputs: |
            assets/github-readme-snake.svg
            assets/github-readme-snake-dark.svg?palette=github-dark

      - name: Push snake animation to assets
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update git-readme-snake animation"
          file_pattern: assets/github-readme-snake*.svg
