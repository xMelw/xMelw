name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake SVG with custom plum palette
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: xMelw
          outputs: |
            dist/github-readme-snake-plum.svg?color_snake=#FFFFFF&color_dots=#302733,#49374D,#755477,#B99BC1,#EDE5EF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
