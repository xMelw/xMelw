name: generate animation

on:
  # Executa automaticamente a cada 12 horas
  schedule:
    - cron: "0 */12 * * *"
  
  # Permite executar manualmente a partir do separador "Actions"
  workflow_dispatch:
  
  # Executa sempre que fizeres push na branch principal (main ou master)
  push:
  branches:
    - main
    - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Gera o ficheiro SVG da cobra com base nas tuas contribuições
      - name: Generate github-readme-snake.svg
        uses: Platane/svg-snk@v3
        with:
          github_user_name: xMelw
          outputs: |
            dist/github-readme-snake.svg
            dist/github-readme-snake-dark.svg?palette=github-dark

      # 2. Envia o ficheiro gerado para uma branch chamada "output"
      - name: Push github-readme-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
